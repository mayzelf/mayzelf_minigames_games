<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fineey UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2440;
    --paper: #fff8ec;
    --sky-top: #d8efff;
    --sky-mid: #aed8f6;
    --sky-bot: #8bc3ee;
    --blue: #3a93d4;
    --sun: #ffcf6b;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #1d1a2e;
    color: var(--ink);
    font-family: 'Shantell Sans', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game-container {
    position: relative;
    width: min(100vw, calc(100vh * 0.6));
    height: 100vh;
    max-width: 480px;
    overflow: hidden;
    touch-action: none;
    /* Layered "paper sky" — shows through the transparent Phaser canvas. */
    background:
      radial-gradient(circle at 22% 14%, rgba(255,255,255,0.55), transparent 42%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bot) 100%);
  }

  /* Dotted notebook grid + a faint corner vignette for the hand-drawn feel. */
  #game-container::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(43, 36, 64, 0.10) 1.4px, transparent 1.6px);
    background-size: 26px 26px;
    opacity: 0.55;
  }
  #game-container::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    box-shadow: inset 0 0 120px rgba(43, 36, 64, 0.12);
  }

  canvas { display: block; position: relative; z-index: 1; }

  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 5;
    pointer-events: none;
    font-weight: 700;
    font-size: 18px;
  }

  #hud > div {
    background: var(--paper);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    /* Slightly irregular radii fake a hand-drawn outline. */
    border-radius: 14px 18px 13px 16px / 16px 13px 18px 14px;
    padding: 3px 12px 4px;
    box-shadow: 2px 2px 0 rgba(43, 36, 64, 0.28);
    transform: rotate(-2deg);
  }
  #hud > #best { transform: rotate(2deg); }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(24, 20, 44, 0.42);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 10;
    padding: 24px;
    text-align: center;
  }

  #overlay.hidden { display: none; }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 340px;
    padding: 30px 28px 32px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px 34px 26px 32px / 32px 26px 34px 28px;
    box-shadow: 6px 7px 0 rgba(43, 36, 64, 0.38);
  }

  #overlay h1 {
    font-family: 'Shantell Sans', cursive;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    font-weight: 800;
    color: var(--blue);
    letter-spacing: -1px;
    line-height: 1;
    transform: rotate(-3deg);
    text-shadow: 3px 3px 0 var(--ink);
  }

  #overlay p {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    opacity: 0.85;
    line-height: 1.55;
    max-width: 300px;
  }

  #overlay .score-display {
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    background: var(--sun);
    border: 2.5px solid var(--ink);
    border-radius: 12px 16px 11px 14px / 14px 11px 16px 12px;
    padding: 3px 18px 5px;
    transform: rotate(-1.5deg);
  }

  #overlay button {
    margin-top: 4px;
    padding: 11px 32px 13px;
    background: var(--sun);
    color: var(--ink);
    font-family: inherit;
    font-size: 19px;
    font-weight: 800;
    border: 3px solid var(--ink);
    border-radius: 16px 20px 15px 18px / 18px 15px 20px 16px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  #overlay button:hover { transform: translate(-1px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  #overlay button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  /* Secondary "ghost" button (Inventory). */
  button.ghost-btn { background: transparent; box-shadow: 2px 2px 0 rgba(43,36,64,0.25); border-style: dashed; font-size: 16px; padding: 8px 22px 10px; }

  /* --- Unlock toast --- */
  #toast {
    position: absolute;
    top: 58px; left: 50%;
    transform: translate(-50%, -12px);
    display: none; align-items: center; gap: 10px;
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 14px 18px 13px 16px / 16px 13px 18px 14px;
    box-shadow: 3px 3px 0 rgba(43,36,64,0.3);
    padding: 6px 14px 7px 8px;
    z-index: 8; pointer-events: none; max-width: 86%;
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #toast.show { display: flex; }
  #toast.in { opacity: 1; transform: translate(-50%, 0); }
  #toast img { width: 36px; height: 36px; flex: 0 0 auto; }
  #toast .t-main { font-weight: 800; font-size: 14px; color: var(--ink); line-height: 1.15; }
  #toast .t-sub { font-size: 11px; font-weight: 700; opacity: 0.7; }

  /* --- Inventory --- */
  #inventory {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    background: rgba(24,20,44,0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  #inventory.hidden { display: none; }

  .panel.inv {
    width: 100%; height: 100%; max-width: 460px;
    padding: 14px; gap: 10px; align-items: stretch;
    border-radius: 24px 28px 22px 26px / 26px 22px 28px 24px;
  }

  .inv-head { display: flex; align-items: center; justify-content: space-between; }
  .inv-head h2 { font-size: 26px; color: var(--blue); transform: rotate(-2deg); text-shadow: 2px 2px 0 var(--ink); }
  .icon-btn {
    width: 36px; height: 36px; padding: 0; margin: 0;
    font-size: 20px; line-height: 1; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px 14px 11px 13px / 13px 11px 14px 12px;
  }

  .inv-preview {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    border: 2.5px dashed var(--ink); border-radius: 16px;
    background: #fffdf6;
  }
  .inv-preview img { width: 62px; height: 62px; flex: 0 0 auto; }
  .inv-preview .p-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .inv-preview .p-name { font-weight: 800; font-size: 18px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; padding: 0; }
  .swatch.on { outline: 2.5px solid var(--blue); outline-offset: 1px; }

  .inv-count { font-size: 12px; font-weight: 700; opacity: 0.75; text-align: center; }

  .skin-grid {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 2px;
    align-content: start; grid-auto-rows: min-content;
  }
  .skin-card {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: #fff; border: 2.5px solid var(--ink);
    border-radius: 12px 16px 13px 15px / 15px 13px 16px 12px;
    padding: 7px 4px 6px; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(43,36,64,0.18);
  }
  .skin-card.locked { cursor: default; opacity: 0.65; background: #efe9dc; }
  .skin-card.sel { outline: 3px solid var(--blue); outline-offset: 1px; }
  .skin-card img, .skin-card .lockmark { width: 48px; height: 48px; }
  .skin-card .lockmark { display: flex; align-items: center; justify-content: center; font-size: 26px; opacity: 0.5; }
  .skin-card .s-name { font-size: 11px; font-weight: 800; text-align: center; }
  .badge { font-size: 9px; font-weight: 800; padding: 1px 7px 2px; border-radius: 8px; border: 1.5px solid var(--ink); white-space: nowrap; }
  .badge.common { background: #bfe8d6; }
  .badge.rare { background: #bcdcff; }
  .badge.super { background: linear-gradient(90deg, #ffe08a, #ffb02e); }
</style>
</head>
<body>
<div id="game-container">
  <div id="hud">
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1>Fineey&nbsp;UP</h1>
      <p>Bounce up an endless tower of ledges! Move with arrow keys or A/D — the screen wraps. Tap or click to fling a dart at the spiky grumps, snag a spring for a big launch. One fall and it's all the way back down.</p>
      <button id="start-btn">Play</button>
      <button id="inv-btn" class="ghost-btn">Inventory</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="inventory" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
(function () {
  const GAME_W = 480;
  const GAME_H = 800;
  const GRAVITY = 1400;
  const JUMP_VEL = -780;
  const MOVE_SPEED = 320;
  const SPRING_VEL = -1300;
  const PLATFORM_W = 80;
  const PLATFORM_H = 18;
  const PROJECTILE_SPEED = 700;

  const container = document.getElementById('game-container');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start-btn');

  let bestScore = parseInt(localStorage.getItem('fineeyUP_best') || '0', 10);
  bestEl.textContent = 'Best: ' + bestScore;

  // Inline SVG assets so the game works when opened directly via file:// (no server).
  // Everything shares a hand-drawn look: bold ink outlines + a feTurbulence "rough"
  // filter that wobbles the edges. The filter is baked into the texture once at load,
  // so there's no per-frame cost.
  const INK = '#2b2440';
  const rough = (id, freq, scale, seed) =>
    `<filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">` +
    `<feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="2" seed="${seed}" result="n"/>` +
    `<feDisplacementMap in="SourceGraphic" in2="n" scale="${scale}"/></filter>`;

  const SVG = {
    enemy: `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs>
<linearGradient id="eb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff7b6b"/><stop offset="100%" stop-color="#d63a2f"/></linearGradient>
${rough('re', '0.022', '2.6', '3')}
</defs>
<g filter="url(#re)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round" fill="none">
<path d="M50 12 L59 29 L78 24 L71 42 L88 51 L70 59 L76 78 L57 71 L50 88 L43 71 L24 78 L30 59 L12 51 L29 42 L22 24 L41 29 Z" fill="url(#eb)" stroke-width="3.2"/>
<circle cx="50" cy="51" r="20" fill="#ff9a8d" opacity="0.45" stroke="none"/>
<path d="M34 41 L47 47" stroke-width="3"/>
<path d="M66 41 L53 47" stroke-width="3"/>
<circle cx="42" cy="50" r="6" fill="#fff" stroke-width="2.5"/>
<circle cx="58" cy="50" r="6" fill="#fff" stroke-width="2.5"/>
<circle cx="43" cy="51" r="3" fill="${INK}" stroke="none"/>
<circle cx="57" cy="51" r="3" fill="${INK}" stroke="none"/>
<path d="M40 64 L44 60 L48 64 L52 60 L56 64 L60 60" stroke-width="2.5"/>
</g>
</svg>`,
    // A little dart, drawn pointing right (+x); shoot() rotates it to its heading.
    projectile: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="22" viewBox="0 0 48 22">
<defs>
${rough('rp', '0.05', '1', '5')}
</defs>
<g filter="url(#rp)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">
<path d="M3 4 L14 11 L3 18 L7 11 Z" fill="#ffcf6b" stroke-width="2"/>
<path d="M12 9.2 L31 9.2 L31 12.8 L12 12.8 Z" fill="#6c5ce7" stroke-width="2"/>
<path d="M28 5 L45 11 L28 17 L32 11 Z" fill="#ff5a5f" stroke-width="2"/>
</g>
</svg>`,
    spring: `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
<defs>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b6a8ff"/><stop offset="100%" stop-color="#6c5ce7"/></linearGradient>
${rough('rs', '0.03', '1.6', '2')}
</defs>
<g filter="url(#rs)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round" fill="none">
<ellipse cx="20" cy="35" rx="12" ry="3.5" fill="url(#sg)" stroke-width="2.5"/>
<path d="M10 31 C32 29 30 23 10 21 C30 19 32 13 10 11" stroke="#6c5ce7" stroke-width="3.6"/>
<path d="M13 11 L20 3 L27 11" stroke="#6c5ce7" stroke-width="3.6"/>
</g>
</svg>`,
    platform: `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="34" viewBox="0 0 100 34">
<defs>
<linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ef0c4"/><stop offset="100%" stop-color="#22c39a"/></linearGradient>
${rough('rl', '0.03', '2.4', '9')}
</defs>
<g filter="url(#rl)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round" fill="none">
<path d="M22 5 Q20 -1 24 1 Q26 -3 28 1 Q32 -2 30 5" fill="#34d399" stroke-width="2"/>
<path d="M68 5 Q66 0 70 2 Q72 -2 74 2 Q78 -1 76 5" fill="#34d399" stroke-width="2"/>
<rect x="5" y="5" width="90" height="25" rx="12" fill="url(#pl)" stroke-width="3.2"/>
<path d="M14 12 Q50 9 86 12" stroke="#e7fff5" stroke-width="3" opacity="0.85"/>
<path d="M18 24 l6 4 M34 25 l6 3 M62 24 l6 4 M78 25 l5 3" stroke="#178f6f" stroke-width="1.6" opacity="0.55"/>
</g>
</svg>`,
    // Scribbled clouds — a bumpy hand-drawn silhouette (not a stack of balls),
    // with a couple of loose interior pencil strokes. Two variants for variety.
    cloud: `<svg xmlns="http://www.w3.org/2000/svg" width="132" height="74" viewBox="0 0 132 74">
<defs>${rough('rc1', '0.022', '2.6', '4')}</defs>
<g filter="url(#rc1)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">
<path d="M30 62 Q13 62 13 49 Q3 45 11 35 Q9 22 26 25 Q31 11 49 17 Q60 6 75 15 Q94 9 98 26 Q117 24 116 41 Q128 46 116 57 Q112 63 100 62 Z" fill="#ffffff" stroke-width="2.6"/>
<path d="M34 54 Q48 59 64 55" stroke="${INK}" stroke-width="1.5" opacity="0.2" fill="none"/>
<path d="M70 57 Q86 60 102 55" stroke="${INK}" stroke-width="1.5" opacity="0.2" fill="none"/>
</g>
</svg>`,
    cloud2: `<svg xmlns="http://www.w3.org/2000/svg" width="116" height="66" viewBox="0 0 116 66">
<defs>${rough('rc2', '0.026', '2.4', '11')}</defs>
<g filter="url(#rc2)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">
<path d="M27 55 Q11 54 13 42 Q5 36 14 29 Q15 17 30 22 Q38 9 53 17 Q68 10 76 24 Q95 21 95 37 Q108 41 97 52 Q92 56 80 54 Z" fill="#ffffff" stroke-width="2.6"/>
<path d="M30 47 Q44 52 60 48" stroke="${INK}" stroke-width="1.5" opacity="0.2" fill="none"/>
</g>
</svg>`
  };

  const svgToDataURI = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  // ===========================================================================
  // Skins & colour patterns
  // ===========================================================================
  // Darken a #rrggbb colour by factor f (0..1).
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * f);
    const g = Math.round(((n >> 8) & 255) * f);
    const b = Math.round((n & 255) * f);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  // Shared colour patterns. A skin unlocked a second time grants one of these as
  // a new colour pattern instead of a duplicate entry.
  const PALETTES = [
    { name: 'Mint',   body: ['#9bf3d6', '#27bd91'], accent: '#ffb938', eye: '#1a1530' },
    { name: 'Berry',  body: ['#ff9ad1', '#d6418a'], accent: '#ffe06b', eye: '#2a1030' },
    { name: 'Sky',    body: ['#9fd8ff', '#3a8fe0'], accent: '#ffd45e', eye: '#14213f' },
    { name: 'Sunset', body: ['#ffd07a', '#ff7a4d'], accent: '#fff1a8', eye: '#3a1620' },
    { name: 'Grape',  body: ['#c9a8ff', '#7a4fd6'], accent: '#7df0c4', eye: '#1b1240' },
    { name: 'Lime',   body: ['#dcff8a', '#86d92f'], accent: '#ff8fab', eye: '#20300f' },
    { name: 'Steel',  body: ['#c7d0db', '#6b7686'], accent: '#ffd45e', eye: '#1c2230' },
    { name: 'Aqua',   body: ['#aef0ff', '#2bc4d6'], accent: '#ff8fab', eye: '#103038' }
  ];

  // Reusable doodle parts (all reference the active palette `p`).
  const part = {
    foot: (p) => { const c = shade(p.body[1], 0.78);
      return `<ellipse cx="39" cy="93" rx="8" ry="4.5" fill="${c}" stroke-width="2.5"/><ellipse cx="61" cy="93" rx="8" ry="4.5" fill="${c}" stroke-width="2.5"/>`; },
    arms: () => `<path d="M22 58 Q11 60 11 68" stroke-width="3"/><path d="M78 58 Q89 60 89 68" stroke-width="3"/>`,
    blush: () => `<ellipse cx="30" cy="60" rx="6" ry="4" fill="#ff8fab" opacity="0.4" stroke="none"/><ellipse cx="70" cy="60" rx="6" ry="4" fill="#ff8fab" opacity="0.4" stroke="none"/>`,
    smile: () => `<path d="M44 71 Q50 76 56 71" stroke-width="2.5"/>`,
    belly: () => `<ellipse cx="50" cy="67" rx="18" ry="20" fill="#ffffff" opacity="0.2" stroke="none"/>`,
    egg: () => `<path d="M50 22 C73 22 85 41 85 61 C85 83 70 95 50 95 C30 95 15 83 15 61 C15 41 27 22 50 22 Z" fill="url(#bg)" stroke-width="3.2"/>`,
    antL: () => `<path d="M40 28 Q35 13 31 8" stroke-width="3"/><circle cx="30" cy="7" r="5.5" fill="url(#ag)" stroke-width="2.5"/>`,
    antR: () => `<path d="M60 28 Q65 13 69 8" stroke-width="3"/><circle cx="70" cy="7" r="5.5" fill="url(#ag)" stroke-width="2.5"/>`,
    almond: (cx, p) => `<ellipse cx="${cx}" cy="50" rx="8" ry="11.5" fill="${p.eye}" stroke-width="2.5"/><circle cx="${cx + 3}" cy="45" r="3.1" fill="#fff" stroke="none"/><circle cx="${cx - 3}" cy="54" r="1.4" fill="#fff" opacity="0.7" stroke="none"/>`
  };

  // Each skin renders the inner <g> content for a given palette `p`.
  const SKINS = [
    { id: 'classic', name: 'Classic', rarity: 'Common', def: 0, render: (p) =>
        part.antL() + part.antR() + part.arms() + part.egg() + part.belly() + part.foot(p) + part.blush()
        + part.almond(39, p) + part.almond(61, p) + part.smile() },
    { id: 'cyclops', name: 'Cyclops', rarity: 'Common', def: 2, render: (p) =>
        `<path d="M50 26 Q50 12 50 7" stroke-width="3"/><circle cx="50" cy="6" r="5.5" fill="url(#ag)" stroke-width="2.5"/>`
        + part.arms() + part.egg() + part.belly() + part.foot(p) + part.blush()
        + `<ellipse cx="50" cy="50" rx="12.5" ry="14.5" fill="${p.eye}" stroke-width="2.5"/><circle cx="54" cy="44" r="4.2" fill="#fff" stroke="none"/><circle cx="45" cy="55" r="2" fill="#fff" opacity="0.7" stroke="none"/>`
        + part.smile() },
    { id: 'triclops', name: 'Triclops', rarity: 'Common', def: 5, render: (p) => {
        const eye = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.eye}" stroke-width="2.5"/><circle cx="${cx + r * 0.4}" cy="${cy - r * 0.4}" r="${r * 0.35}" fill="#fff" stroke="none"/>`;
        return part.antL() + part.antR() + part.arms() + part.egg() + part.belly() + part.foot(p) + part.blush()
          + eye(36, 54, 6) + eye(64, 54, 6) + eye(50, 38, 6.5) + part.smile(); } },
    { id: 'blobby', name: 'Blobby', rarity: 'Common', def: 7, render: (p) =>
        part.arms()
        + `<path d="M50 28 C78 28 92 46 92 63 C92 85 73 95 50 95 C27 95 8 85 8 63 C8 46 22 28 50 28 Z" fill="url(#bg)" stroke-width="3.2"/>`
        + `<ellipse cx="35" cy="93" rx="6" ry="3.5" fill="${shade(p.body[1], 0.78)}" stroke-width="2.5"/><ellipse cx="65" cy="93" rx="6" ry="3.5" fill="${shade(p.body[1], 0.78)}" stroke-width="2.5"/>`
        + part.blush()
        + `<path d="M32 56 Q39 50 46 56" stroke-width="2.5"/><path d="M54 56 Q61 50 68 56" stroke-width="2.5"/>`
        + `<ellipse cx="50" cy="68" rx="5" ry="4" fill="${p.eye}" stroke-width="2"/>` },
    { id: 'robo', name: 'Robo', rarity: 'Rare', def: 6, render: (p) =>

        + `<path d="M40 70 L60 70 M44 67 L44 73 M50 67 L50 73 M56 67 L56 73" stroke-width="2"/>` },
    { id: 'horned', name: 'Horned', rarity: 'Rare', def: 1, render: (p) =>
        `<path d="M37 25 Q31 13 29 8 Q37 13 43 23 Z" fill="url(#bg)" stroke-width="2.5"/><path d="M63 25 Q69 13 71 8 Q63 13 57 23 Z" fill="url(#bg)" stroke-width="2.5"/>`
        + part.arms() + part.egg() + part.belly() + part.foot(p) + part.blush()
        + `<path d="M31 41 L45 46" stroke-width="2.5"/><path d="M69 41 L55 46" stroke-width="2.5"/>`
        + part.almond(40, p) + part.almond(60, p)
        + `<path d="M43 70 Q50 77 57 70 Z" fill="#fff" stroke-width="2.5"/><path d="M45 71 L46 75 L48 71 Z" fill="#fff" stroke="none"/><path d="M52 71 L54 75 L55 71 Z" fill="#fff" stroke="none"/>` },
    { id: 'ghost', name: 'Ghosty', rarity: 'Rare', def: 4, render: (p) =>
        `<path d="M50 16 C70 16 82 33 82 53 L82 88 L74 80 L66 88 L58 80 L50 88 L42 80 L34 88 L26 80 L18 88 L18 53 C18 33 30 16 50 16 Z" fill="url(#bg)" fill-opacity="0.86" stroke-width="3.2"/>`
        + `<ellipse cx="50" cy="62" rx="16" ry="18" fill="#ffffff" opacity="0.18" stroke="none"/>`

        + `<ellipse cx="50" cy="64" rx="4" ry="5" fill="${p.eye}" stroke-width="2"/>` },
    { id: 'cosmic', name: 'Cosmic', rarity: 'Super Special', def: 4, render: (p) => {

          + part.arms() + part.egg() + part.foot(p)
          + star(30, 50, 3, '#ffffff') + star(70, 56, 2.5, '#ffffff') + star(58, 80, 2.5, p.accent) + star(40, 82, 2, '#ffffff') + star(68, 40, 2, '#ffffff')
          + part.almond(40, p) + part.almond(60, p)
          + star(40, 46, 2, '#fff') + star(60, 46, 2, '#fff')
          + part.smile(); } },
    { id: 'royal', name: 'Royal', rarity: 'Super Special', def: 3, render: (p) =>
        part.arms() + part.egg() + part.belly() + part.foot(p) + part.blush()
        + part.almond(40, p) + part.almond(60, p) + part.smile()
        + `<path d="M33 24 L33 12 L41 18 L50 9 L59 18 L67 12 L67 24 Z" fill="#ffd445" stroke-width="2.5"/>`
        + `<circle cx="33" cy="11" r="2" fill="#ff5a7a" stroke-width="1.5"/><circle cx="50" cy="8" r="2.2" fill="#ff5a7a" stroke-width="1.5"/><circle cx="67" cy="11" r="2" fill="#ff5a7a" stroke-width="1.5"/>`
        + `<path d="M50 34 L54 39 L50 45 L46 39 Z" fill="#5ad1ff" stroke-width="2"/>` }
  ];
  const skinsById = {};
  SKINS.forEach((s) => { skinsById[s.id] = s; });

  function buildSkin(skin, p) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p.body[0]}"/><stop offset="100%" stop-color="${p.body[1]}"/></linearGradient>
<radialGradient id="ag" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="${p.accent}"/><stop offset="100%" stop-color="${shade(p.accent, 0.78)}"/></radialGradient>
${rough('rf', '0.018', '3', '7')}
</defs>
<g filter="url(#rf)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round" fill="none">
${skin.render(p)}
</g>
</svg>`;
  }

  // --- Progress: unlocked skins/patterns + current selection (localStorage) ---
  let unlocked, selected;
  const patMemory = {}; // last-viewed palette per owned skin
  function loadProgress() {
    try { unlocked = JSON.parse(localStorage.getItem('fineeyUP_unlocked')) || {}; } catch (e) { unlocked = {}; }
    if (!unlocked.classic || !unlocked.classic.length) unlocked.classic = [skinsById.classic.def];
    try { selected = JSON.parse(localStorage.getItem('fineeyUP_selected')); } catch (e) { selected = null; }
    if (!selected || !skinsById[selected.skin] || !unlocked[selected.skin] || !unlocked[selected.skin].includes(selected.pat)) {
      selected = { skin: 'classic', pat: skinsById.classic.def };
    }
    // Default each owned skin's shown colour to its signature palette when owned.
    SKINS.forEach((s) => {
      if (unlocked[s.id] && unlocked[s.id].length) {
        patMemory[s.id] = unlocked[s.id].includes(s.def) ? s.def : unlocked[s.id][0];
      }
    });
    patMemory[selected.skin] = selected.pat;
  }
  const saveUnlocked = () => localStorage.setItem('fineeyUP_unlocked', JSON.stringify(unlocked));
  const saveSelected = () => localStorage.setItem('fineeyUP_selected', JSON.stringify(selected));

  const RARITY_WEIGHT = { 'Common': 50, 'Rare': 18, 'Super Special': 5 };
  const lockablePatterns = (id) => { const owned = unlocked[id] || []; return PALETTES.map((_, i) => i).filter((i) => !owned.includes(i)); };
  const skinLocked = (id) => !unlocked[id] || !unlocked[id].length;
  const hasLockable = (s) => skinLocked(s.id) || lockablePatterns(s.id).length > 0;

  function weightedSkin() {
    let total = 0; for (const s of SKINS) total += RARITY_WEIGHT[s.rarity] || 1;
    let r = Math.random() * total;
    for (const s of SKINS) { r -= RARITY_WEIGHT[s.rarity] || 1; if (r <= 0) return s; }
    return SKINS[0];
  }

  // Pick a random skin (rarity-weighted). New skin -> unlock it; duplicate ->
  // unlock a random new colour pattern for it. Returns the unlock, or null when
  // everything is already owned.
  function rollUnlock() {
    if (!SKINS.some(hasLockable)) return null;
    let skin = null;
    for (let t = 0; t < 14; t++) { const s = weightedSkin(); if (hasLockable(s)) { skin = s; break; } }
    if (!skin) { const opts = SKINS.filter(hasLockable); skin = opts[Math.floor(Math.random() * opts.length)]; }
    if (skinLocked(skin.id)) {
      unlocked[skin.id] = [skin.def]; patMemory[skin.id] = skin.def; saveUnlocked();
      return { type: 'skin', skin, pat: skin.def };
    }
    const rem = lockablePatterns(skin.id);
    const pat = rem[Math.floor(Math.random() * rem.length)];
    unlocked[skin.id].push(pat); unlocked[skin.id].sort((a, b) => a - b); saveUnlocked();
    return { type: 'pattern', skin, pat };
  }

  function maybeUnlock(chance) {
    if (Math.random() >= chance) return;
    const res = rollUnlock();
    if (res) showToast(res);
  }

  function activeSkinSVG() { return buildSkin(skinsById[selected.skin], PALETTES[selected.pat]); }

  // --- In-game unlock toast ---
  const toastEl = document.getElementById('toast');
  let toastTimer = null, toastTimer2 = null;
  function showToast(res) {
    const p = PALETTES[res.pat];
    const icon = svgToDataURI(buildSkin(res.skin, p));
    const main = res.type === 'skin' ? 'New skin unlocked!' : 'New colour unlocked!';
    const sub = res.type === 'skin' ? `${res.skin.name} · ${res.skin.rarity}` : `${res.skin.name} · ${p.name}`;
    toastEl.innerHTML = `<img src="${icon}" alt=""><div><div class="t-main">${main}</div><div class="t-sub">${sub}</div></div>`;
    toastEl.classList.add('show');
    clearTimeout(toastTimer); clearTimeout(toastTimer2);
    requestAnimationFrame(() => toastEl.classList.add('in'));
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('in');
      toastTimer2 = setTimeout(() => toastEl.classList.remove('show'), 300);
    }, 2600);
  }

  // --- Inventory UI ---
  const inventoryEl = document.getElementById('inventory');
  const rarityClass = (r) => (r === 'Common' ? 'common' : r === 'Rare' ? 'rare' : 'super');

  function renderInventory() {
    const ownedSkins = SKINS.filter((s) => !skinLocked(s.id)).length;
    let colours = 0; for (const id in unlocked) colours += (unlocked[id] || []).length;

    const sel = skinsById[selected.skin];
    const selPal = PALETTES[selected.pat];
    const swatches = (unlocked[selected.skin] || []).slice().sort((a, b) => a - b).map((i) => {
      const pp = PALETTES[i];
      return `<button class="swatch${i === selected.pat ? ' on' : ''}" data-pat="${i}" title="${pp.name}" style="background:linear-gradient(135deg,${pp.body[0]},${pp.body[1]})"></button>`;
    }).join('');

    const cards = SKINS.map((s) => {
      const locked = skinLocked(s.id);
      const selCls = s.id === selected.skin ? ' sel' : '';
      const inner = locked
        ? `<div class="lockmark">🔒</div><div class="s-name">???</div><span class="badge ${rarityClass(s.rarity)}">${s.rarity}</span>`
        : `<img src="${svgToDataURI(buildSkin(s, PALETTES[patMemory[s.id] != null ? patMemory[s.id] : unlocked[s.id][0]]))}" alt=""><div class="s-name">${s.name}</div><span class="badge ${rarityClass(s.rarity)}">${s.rarity}</span>`;
      return `<div class="skin-card${locked ? ' locked' : ''}${selCls}" data-skin="${s.id}">${inner}</div>`;
    }).join('');

    inventoryEl.innerHTML = `
      <div class="panel inv">
        <div class="inv-head">
          <h2>Inventory</h2>
          <button class="icon-btn" id="inv-close">×</button>
        </div>
        <div class="inv-preview">
          <img src="${svgToDataURI(buildSkin(sel, selPal))}" alt="">
          <div class="p-info">
            <div class="p-name">${sel.name}</div>
            <span class="badge ${rarityClass(sel.rarity)}" style="align-self:flex-start">${sel.rarity}</span>
            <div class="swatches">${swatches}</div>
          </div>
        </div>
        <div class="inv-count">Skins ${ownedSkins}/${SKINS.length} · Colours ${colours}</div>
        <div class="skin-grid">${cards}</div>
      </div>`;

    document.getElementById('inv-close').onclick = closeInventory;
    inventoryEl.querySelectorAll('.skin-card').forEach((c) => {
      if (c.classList.contains('locked')) return;
      c.onclick = () => {
        const id = c.getAttribute('data-skin');
        selected = { skin: id, pat: (patMemory[id] != null ? patMemory[id] : unlocked[id][0]) };
        saveSelected(); renderInventory();
      };
    });
    inventoryEl.querySelectorAll('.swatch').forEach((sw) => {
      sw.onclick = () => {
        const i = parseInt(sw.getAttribute('data-pat'), 10);
        selected.pat = i; patMemory[selected.skin] = i; saveSelected(); renderInventory();
      };
    });
  }

  function openInventory() { renderInventory(); inventoryEl.classList.remove('hidden'); }
  function closeInventory() { inventoryEl.classList.add('hidden'); }

  // Phaser's load.image() explicitly refuses data URIs, so pre-load the SVGs as
  // <img> elements and register them with the TextureManager in preload().
  const preloadedImages = {};
  function preloadSVG(key, svg) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { preloadedImages[key] = img; resolve(); };
      img.onerror = () => resolve();
      img.src = svgToDataURI(svg);
    });
  }
  function preloadAllImages() {
    return Promise.all(Object.entries(SVG).map(([key, svg]) => preloadSVG(key, svg)));
  }

  class FineeyScene extends Phaser.Scene {
    constructor() { super('FineeyUPScene'); }

    preload() {
      for (const [key, img] of Object.entries(preloadedImages)) {
        if (img && !this.textures.exists(key)) this.textures.addImage(key, img);
      }
    }

    create() {
      // Transparent so the CSS "paper sky" (gradient + dotted grid) shows through.
      this.cameras.main.setBackgroundColor('rgba(0,0,0,0)');
      // Give the world ample vertical headroom so static bodies far above the
      // initial bounds still register collisions correctly.
      this.physics.world.setBounds(0, -1000000, GAME_W, 2000000);

      this.cloudLayer = this.add.container(0, 0);
      this.cloudLayer.setDepth(-1);
      this.lowestCloudY = GAME_H;
      this.drawCloudBand(GAME_H, -200);

      this.platforms = this.physics.add.staticGroup();
      this.enemies = this.physics.add.group({ allowGravity: false });
      this.projectiles = this.physics.add.group({ allowGravity: false });
      this.springs = this.physics.add.staticGroup();

      this.score = 0;
      this.lastScoreShown = -1;
      this.lastThousand = 0;
      this.maxHeightReached = GAME_H;
      this.isDead = false;
      this.platformsUntilEnemy = 8;
      this.targetScrollY = 0;

      this.player = this.physics.add.sprite(GAME_W / 2, GAME_H - 120, 'playerSkin');
      this.player.setDisplaySize(56, 56);
      // Remember the fitted scale so squash/stretch tweens can work relative to it.
      this.playerScale = this.player.scaleX;
      this.player.body.setSize(36, 36);
      this.player.body.setOffset(32, 32);
      this.player.setDepth(5);
      this.player.body.setGravityY(0);
      this.physics.world.gravity.y = GRAVITY;

      this.highestPlatformY = GAME_H;
      this.seedPlatforms();

      this.physics.add.collider(this.player, this.platforms, this.onPlatformLand, this.shouldCollidePlatform, this);
      this.physics.add.overlap(this.player, this.springs, this.onSpringHit, null, this);
      this.physics.add.overlap(this.projectiles, this.enemies, this.onProjectileHit, null, this);
      this.physics.add.overlap(this.player, this.enemies, this.onEnemyTouch, null, this);

      this.cursors = this.input.keyboard.createCursorKeys();
      this.keys = this.input.keyboard.addKeys('A,D,W,SPACE');

      this.input.on('pointerdown', (pointer) => {
        if (this.isDead) return;
        this.shoot(pointer.worldX, pointer.worldY);
      });

      // initial upward bounce
      this.player.body.setVelocityY(JUMP_VEL);
    }

    drawCloudBand(fromY, toY) {
      // Fills the world-space band [toY, fromY] (toY < fromY) with scribbled cloud
      // sprites plus the odd "v" bird scribble. One container per band so culling
      // (and disposal) stays a single bandTop check.
      const band = this.add.container(0, 0);
      const count = Math.max(4, Math.floor((fromY - toY) / 150));
      for (let i = 0; i < count; i++) {
        const cx = Phaser.Math.Between(30, GAME_W - 30);
        const cy = Phaser.Math.Between(toY, fromY);
        const cloud = this.add.image(cx, cy, Math.random() < 0.5 ? 'cloud' : 'cloud2');
        const w = Phaser.Math.Between(78, 138);
        cloud.setDisplaySize(w, w * 0.55);
        cloud.setAlpha(Phaser.Math.FloatBetween(0.8, 0.95));
        cloud.setAngle(Phaser.Math.Between(-4, 4));
        if (Math.random() < 0.5) cloud.setFlipX(true);
        band.add(cloud);
      }
      const gfx = this.add.graphics();
      const birds = Phaser.Math.Between(0, 2);
      for (let i = 0; i < birds; i++) {
        const bx = Phaser.Math.Between(40, GAME_W - 40);
        const by = Phaser.Math.Between(toY + 20, fromY - 20);
        gfx.lineStyle(2, 0x2b2440, 0.3);
        gfx.beginPath();
        gfx.moveTo(bx - 9, by); gfx.lineTo(bx - 3, by - 5); gfx.lineTo(bx + 1, by);
        gfx.moveTo(bx + 1, by); gfx.lineTo(bx + 5, by - 5); gfx.lineTo(bx + 11, by);
        gfx.strokePath();
      }
      band.add(gfx);
      band.bandTop = toY;     // smallest Y (highest altitude)
      band.bandBottom = fromY; // largest Y (lowest altitude)
      this.cloudLayer.add(band);
      if (toY < this.lowestCloudY) this.lowestCloudY = toY;
    }

    seedPlatforms() {
      // Base ground platform
      this.spawnPlatform(GAME_W / 2, GAME_H - 40, false, false);
      let y = GAME_H - 140;
      while (y > -200) {
        const x = Phaser.Math.Between(40, GAME_W - 40);
        this.spawnPlatform(x, y, false, false);
        y -= Phaser.Math.Between(70, 110);
      }
      this.highestPlatformY = y;
    }

    spawnPlatform(x, y, allowMoving, allowSpring) {
      const moving = allowMoving && Phaser.Math.Between(0, 100) < 25;
      const plat = this.platforms.create(x, y, 'platform');
      plat.setDisplaySize(PLATFORM_W, PLATFORM_H);
      plat.body.setSize(PLATFORM_W, PLATFORM_H);
      plat.refreshBody();
      plat.isMoving = moving;
      if (moving) {
        plat.moveSpeed = Phaser.Math.Between(60, 110) * (Math.random() < 0.5 ? -1 : 1);
        plat.setTint(0xffeaa7);
      }
      if (allowSpring && Phaser.Math.Between(0, 100) < 12) {
        // Bottom-center origin planted on the platform top so its squash compresses
        // downward (anchored) rather than shrinking toward its middle.
        const spring = this.springs.create(x, y - PLATFORM_H / 2 + 3, 'spring');
        spring.setOrigin(0.5, 1);
        spring.setDisplaySize(30, 32);
        spring.body.setSize(26, 28);
        spring.refreshBody();
        spring.linkedPlatform = plat;
        plat.spring = spring;
      }
      if (y < this.highestPlatformY) this.highestPlatformY = y;
      return plat;
    }

    shouldCollidePlatform(player, platform) {
      // One-way: only collide when falling and player's bottom is above (or just at) platform top
      if (player.body.velocity.y < 0) return false;
      const playerBottom = player.body.bottom;
      const platTop = platform.body.top;
      return playerBottom <= platTop + 12;
    }

    onPlatformLand(player, platform) {
      if (this.isDead) return;
      player.body.setVelocityY(JUMP_VEL);
      this.squashPlayer();
    }

    // Quick squash-and-stretch on bounce, kept relative to the fitted base scale.
    squashPlayer() {
      const s = this.playerScale;
      this.tweens.killTweensOf(this.player);
      this.player.setScale(s);
      this.tweens.add({
        targets: this.player,
        scaleX: s * 1.22, scaleY: s * 0.8,
        yoyo: true, duration: 110, ease: 'Quad.out'
      });
    }

    onSpringHit(player, spring) {
      if (this.isDead) return;
      if (player.body.velocity.y < 0) return;
      const playerBottom = player.body.bottom;
      if (playerBottom > spring.body.top + 14) return;
      player.body.setVelocityY(SPRING_VEL);
      this.squashPlayer();
      // Anchored compress (bottom origin) then springy release.
      const bx = spring.scaleX, by = spring.scaleY;
      this.tweens.killTweensOf(spring);
      this.tweens.add({
        targets: spring, scaleX: bx * 1.3, scaleY: by * 0.5,
        duration: 70, ease: 'Quad.out',
        yoyo: true, hold: 20,
        onComplete: () => { spring.setScale(bx, by); }
      });
    }

    onProjectileHit(projectile, enemy) {
      projectile.destroy();
      enemy.destroy();
      this.score += 50;
      maybeUnlock(0.05); // 5% chance to unlock a skin on a kill
    }

    onEnemyTouch(player, enemy) {
      if (this.isDead) return;
      // Stomp from above kills the enemy
      if (player.body.velocity.y > 0 && player.body.bottom < enemy.body.top + 20) {
        enemy.destroy();
        player.body.setVelocityY(JUMP_VEL);
        this.squashPlayer();
        this.score += 25;
        maybeUnlock(0.05); // 5% chance to unlock a skin on a kill
      } else {
        this.die();
      }
    }

    shoot(targetX, targetY) {
      const proj = this.projectiles.create(this.player.x, this.player.y - 8, 'projectile');
      proj.setDisplaySize(36, 17);
      proj.body.setSize(30, 14);
      const dx = targetX - this.player.x;
      const dy = targetY - this.player.y;
      const d = Math.hypot(dx, dy) || 1;
      proj.rotation = Math.atan2(dy, dx); // dart points along its heading
      proj.setDepth(4);
      proj.body.setVelocity((dx / d) * PROJECTILE_SPEED, (dy / d) * PROJECTILE_SPEED);
      this.time.delayedCall(1500, () => { if (proj.active) proj.destroy(); });
    }

    spawnEnemyAt(x, y) {
      const enemy = this.enemies.create(x, y, 'enemy');
      enemy.setDisplaySize(44, 44);
      enemy.body.setSize(32, 32);
      enemy.body.setOffset(34, 34);
      enemy.body.setAllowGravity(false);
      enemy.body.setVelocityX(Phaser.Math.Between(0, 1) ? 90 : -90);
      enemy.setDepth(4);
      return enemy;
    }

    update(time, delta) {
      if (this.isDead) return;

      const left = this.cursors.left.isDown || this.keys.A.isDown;
      const right = this.cursors.right.isDown || this.keys.D.isDown;
      if (left) this.player.body.setVelocityX(-MOVE_SPEED);
      else if (right) this.player.body.setVelocityX(MOVE_SPEED);
      else this.player.body.setVelocityX(0);

      // Screen wrap horizontally (Doodle Jump style)
      if (this.player.x < -20) this.player.x = GAME_W + 20;
      else if (this.player.x > GAME_W + 20) this.player.x = -20;

      // Flip sprite based on movement
      if (left) this.player.setFlipX(true);
      else if (right) this.player.setFlipX(false);

      // Gentle lean in the direction of travel for a bit of life.
      const targetTilt = (left ? -0.16 : right ? 0.16 : 0);
      this.player.rotation = Phaser.Math.Linear(this.player.rotation, targetTilt, Math.min(1, (delta / 1000) * 10));

      // Move moving platforms
      this.platforms.children.iterate((plat) => {
        if (!plat) return;
        if (plat.isMoving) {
          plat.x += (plat.moveSpeed * delta) / 1000;
          if (plat.x < 40 || plat.x > GAME_W - 40) plat.moveSpeed *= -1;
          plat.body.x = plat.x - PLATFORM_W / 2;
          plat.body.updateFromGameObject();
          if (plat.spring && plat.spring.active) {
            plat.spring.x = plat.x;
            plat.spring.body.updateFromGameObject();
          }
        }
      });

      // Enemies patrol horizontally — only flip when moving INTO an edge,
      // not while loitering on the wrong side of the threshold.
      this.enemies.children.iterate((e) => {
        if (!e) return;
        const vx = e.body.velocity.x;
        if (e.x < 30 && vx < 0) e.body.setVelocityX(Math.abs(vx) || 80);
        else if (e.x > GAME_W - 30 && vx > 0) e.body.setVelocityX(-(Math.abs(vx) || 80));
      });

      // Camera: target follows player upward only; smoothed via lerp for a calm feel.
      const desired = this.player.y - GAME_H * 0.4;
      if (desired < this.targetScrollY) this.targetScrollY = desired;
      const lerpAmt = Math.min(1, (delta / 1000) * 8); // ~0.13 at 60fps
      const cam = this.cameras.main;
      cam.scrollY = Phaser.Math.Linear(cam.scrollY, this.targetScrollY, lerpAmt);

      // Score based on height — only touch DOM when value changes.
      const heightScore = Math.max(0, Math.floor((GAME_H - this.player.y) / 10));
      if (heightScore > this.score) this.score = heightScore;
      if (this.player.y < this.maxHeightReached) this.maxHeightReached = this.player.y;
      if (this.score !== this.lastScoreShown) {
        scoreEl.textContent = String(this.score);
        this.lastScoreShown = this.score;
      }

      // Every 1000 points crossed: 10% chance to unlock a skin.
      const thousand = Math.floor(this.score / 1000);
      while (this.lastThousand < thousand) { this.lastThousand++; maybeUnlock(0.10); }

      // Use the *target* scroll (not the lerped one) for world generation
      // so platforms/clouds populate ahead of the camera instead of lagging behind it.
      const viewTop = this.targetScrollY;
      const viewBottom = cam.scrollY + GAME_H;

      // Generate new platforms above the highest one. Enemies are dropped in
      // alongside platform generation so they enter naturally with the scroll.
      while (this.highestPlatformY > viewTop - 400) {
        const x = Phaser.Math.Between(40, GAME_W - 40);
        const newY = this.highestPlatformY - Phaser.Math.Between(70, 120);
        this.spawnPlatform(x, newY, true, true);

        this.platformsUntilEnemy--;
        if (this.platformsUntilEnemy <= 0 && this.maxHeightReached < GAME_H - 200) {
          // Skip if a live enemy is already nearby — prevents clustering on bursty climbs.
          const tooClose = this.enemies.getChildren().some(e => Math.abs(e.y - newY) < 300);
          if (!tooClose) {
            const ex = Phaser.Math.Between(60, GAME_W - 60);
            const ey = newY - Phaser.Math.Between(20, 60);
            this.spawnEnemyAt(ex, ey);
            // Cadence tightens as you climb higher, but stays sparser than before.
            const climb = Math.max(0, GAME_H - this.maxHeightReached);
            this.platformsUntilEnemy = Math.max(7, 16 - Math.floor(climb / 2000));
          } else {
            // Try again on the next platform instead of resetting the full cooldown.
            this.platformsUntilEnemy = 1;
          }
        }
      }

      // Extend cloud field upward as the player climbs.
      if (this.lowestCloudY > viewTop - 400) {
        this.drawCloudBand(this.lowestCloudY, this.lowestCloudY - 800);
      }

      // Recycle platforms / clouds / enemies / projectiles that fall below view.
      this.platforms.children.iterate((plat) => {
        if (!plat) return;
        if (plat.y > viewBottom + 80) {
          if (plat.spring && plat.spring.active) plat.spring.destroy();
          plat.destroy();
        }
      });
      this.enemies.children.iterate((e) => {
        if (!e) return;
        if (e.y > viewBottom + 80) e.destroy();
      });
      this.projectiles.children.iterate((p) => {
        if (!p) return;
        if (p.y < viewTop - 100 || p.y > viewBottom + 100 || p.x < -50 || p.x > GAME_W + 50) p.destroy();
      });
      // Cull cloud bands whose entire range is below the view (player climbed past them).
      const cloudKids = this.cloudLayer.list.slice();
      for (const c of cloudKids) {
        if (c.bandTop !== undefined && c.bandTop > viewBottom + 200) c.destroy();
      }

      // Death check — fell below view.
      if (this.player.y > viewBottom + 40) {
        this.die();
      }
    }

    die() {
      if (this.isDead) return;
      this.isDead = true;
      this.player.setTint(0xff6b6b);
      this.player.body.setVelocity(0, 200);
      this.player.body.setGravityY(0);
      // Tumble downward for a little exit flourish.
      this.tweens.killTweensOf(this.player);
      this.tweens.add({ targets: this.player, angle: '+=540', duration: 600, ease: 'Cubic.in' });
      this.time.delayedCall(700, () => showGameOver(this.score));
    }
  }

  let game = null;

  async function startGame() {
    overlay.classList.add('hidden');
    inventoryEl.classList.add('hidden');
    if (!preloadedImages.enemy) await preloadAllImages();
    // (Re)build the selected skin into the player texture for this run.
    await preloadSVG('playerSkin', activeSkinSVG());
    if (game) { game.destroy(true); game = null; }
    game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game-container',
      width: GAME_W,
      height: GAME_H,
      transparent: true,
      fps: { target: 60, forceSetTimeOut: false },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: GRAVITY }, debug: false }
      },
      scene: FineeyScene
    });
  }

  function showGameOver(score) {
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('fineeyUP_best', String(bestScore));
      bestEl.textContent = 'Best: ' + bestScore;
    }
    overlay.innerHTML = `
      <div class="panel">
        <h1>Game&nbsp;Over</h1>
        <div class="score-display">★ ${score}</div>
        <p>Best ${bestScore}</p>
        <button id="restart-btn">Play Again</button>
        <button id="inv-btn2" class="ghost-btn">Inventory</button>
      </div>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('restart-btn').addEventListener('click', startGame);
    document.getElementById('inv-btn2').addEventListener('click', openInventory);
  }

  loadProgress();
  startBtn.addEventListener('click', startGame);
  document.getElementById('inv-btn').addEventListener('click', openInventory);
})();
</script>
</body>
</html>
