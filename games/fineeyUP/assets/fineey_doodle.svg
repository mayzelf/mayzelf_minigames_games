<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#2e86c1"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </radialGradient>
    <radialGradient id="eyeWhite" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6e9"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fd79a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fd79a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1a5276" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Antennae -->
  <line x1="42" y1="38" x2="35" y2="18" stroke="#2e86c1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="35" cy="16" r="5" fill="#fdcb6e" stroke="#e17055" stroke-width="1.5"/>
  <line x1="58" y1="38" x2="65" y2="18" stroke="#2e86c1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="65" cy="16" r="5" fill="#fdcb6e" stroke="#e17055" stroke-width="1.5"/>

  <!-- Body -->
  <ellipse cx="50" cy="62" rx="30" ry="32" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Belly highlight -->
  <ellipse cx="48" cy="65" rx="18" ry="20" fill="#74b9ff" opacity="0.3"/>

  <!-- Feet -->
  <ellipse cx="38" cy="92" rx="8" ry="5" fill="#2e86c1"/>
  <ellipse cx="62" cy="92" rx="8" ry="5" fill="#2e86c1"/>

  <!-- Arms -->
  <ellipse cx="22" cy="60" rx="8" ry="5" fill="#5dade2" transform="rotate(-20 22 60)"/>
  <ellipse cx="78" cy="60" rx="8" ry="5" fill="#5dade2" transform="rotate(20 78 60)"/>

  <!-- Head -->
  <circle cx="50" cy="38" r="18" fill="url(#headGrad)" filter="url(#shadow)"/>

  <!-- Eyes -->
  <circle cx="42" cy="35" r="7" fill="url(#eyeWhite)"/>
  <circle cx="58" cy="35" r="7" fill="url(#eyeWhite)"/>
  <circle cx="43" cy="34" r="4" fill="url(#pupilGrad)"/>
  <circle cx="59" cy="34" r="4" fill="url(#pupilGrad)"/>
  <!-- Eye shine -->
  <circle cx="44" cy="33" r="1.5" fill="#ffffff"/>
  <circle cx="60" cy="33" r="1.5" fill="#ffffff"/>

  <!-- Cheeks -->
  <circle cx="35" cy="42" r="5" fill="url(#cheekGrad)"/>
  <circle cx="65" cy="42" r="5" fill="url(#cheekGrad)"/>

  <!-- Mouth -->
  <path d="M 44 44 Q 50 50 56 44" fill="none" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
</svg>