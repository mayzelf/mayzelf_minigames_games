<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow -->
  <circle cx="20" cy="20" r="18" fill="url(#glowGrad)"/>

  <!-- Main orb -->
  <circle cx="20" cy="20" r="12" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Inner highlight -->
  <circle cx="17" cy="17" r="5" fill="#ffffff" opacity="0.4"/>

  <!-- Sparkle dots -->
  <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="16" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="22" cy="26" r="0.7" fill="#ffffff" opacity="0.5"/>
</svg>