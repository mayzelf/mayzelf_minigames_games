<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="hornGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </radialGradient>
    <radialGradient id="eyeRed" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#d63031"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6b1a1a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Spikes around body -->
  <polygon points="15,45 5,35 22,50" fill="#e17055"/>
  <polygon points="18,60 8,65 25,65" fill="#e17055"/>
  <polygon points="85,45 95,35 78,50" fill="#e17055"/>
  <polygon points="82,60 92,65 75,65" fill="#e17055"/>

  <!-- Horns -->
  <polygon points="38,28 33,8 44,26" fill="url(#hornGrad)"/>
  <polygon points="62,28 67,8 56,26" fill="url(#hornGrad)"/>

  <!-- Body -->
  <ellipse cx="50" cy="55" rx="35" ry="38" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Spiky outline -->
  <circle cx="20" cy="30" r="6" fill="#c0392b"/>
  <circle cx="80" cy="30" r="6" fill="#c0392b"/>
  <circle cx="15" cy="65" r="5" fill="#c0392b"/>
  <circle cx="85" cy="65" r="5" fill="#c0392b"/>
  <circle cx="50" cy="15" r="7" fill="#c0392b"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="50" rx="8" ry="9" fill="url(#eyeRed)"/>
  <ellipse cx="60" cy="50" rx="8" ry="9" fill="url(#eyeRed)"/>
  <!-- Pupils -->
  <circle cx="42" cy="50" r="4" fill="#2d3436"/>
  <circle cx="58" cy="50" r="4" fill="#2d3436"/>
  <!-- Angry eyebrows -->
  <path d="M 32 40 L 46 43" stroke="#6b1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 68 40 L 54 43" stroke="#6b1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eye shine -->
  <circle cx="43" cy="48" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="61" cy="48" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Mouth with teeth -->
  <path d="M 38 68 Q 50 62 62 68" fill="none" stroke="#6b1a1a" stroke-width="1.5"/>
  <polygon points="42,67 44,72 46,67" fill="#ffffff"/>
  <polygon points="50,66 52,72 54,66" fill="#ffffff"/>
  <polygon points="56,67 58,72 60,67" fill="#ffffff"/>

  <!-- Feet -->
  <ellipse cx="38" cy="92" rx="10" ry="5" fill="#c0392b"/>
  <ellipse cx="62" cy="92" rx="10" ry="5" fill="#c0392b"/>
</svg>